<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand fw-bold" href="dashboard.html">CampusConnect</a>
<button class="btn btn-light" onclick="logout()">Logout</button>
</div>
</nav>

<div class="container py-5">
<h1>Welcome, <span id="studentName">Student</span> 👋</h1>
<p class="text-muted">Manage your college events here.</p>

<div class="row g-4 mt-3">
<div class="col-md-4">
<div class="stat-card">
<h5>Available Events</h5>
<h2 id="eventCount">0</h2>
<a href="events.html">Explore Events →</a>
</div>
</div>
<div class="col-md-4">
<div class="stat-card">
<h5>My Registered Events</h5>
<h2 id="registeredCount">0</h2>
</div>
</div>
<div class="col-md-4">
<div class="stat-card">
<h5>My Profile</h5>
<a href="profile.html" class="btn btn-primary">View Profile</a>
</div>
</div>
</div>

<div class="dashboard-card mt-5">
<h3>My Registered Events</h3>
<div id="myEvents" class="row g-3 mt-2"></div>
</div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!token || !user) window.location.href = "login.html";

document.getElementById("studentName").textContent = user.name;

async function loadDashboard() {
    try {
        const eventsResponse = await fetch("http://localhost:5000/api/events");
        const events = await eventsResponse.json();
        document.getElementById("eventCount").textContent = events.length;

        const myResponse = await fetch("http://localhost:5000/api/my-events", {
            headers: {"Authorization": `Bearer ${token}`}
        });
        const myEvents = await myResponse.json();

        document.getElementById("registeredCount").textContent = myEvents.length;
        const container = document.getElementById("myEvents");

        if (myEvents.length === 0) {
            container.innerHTML = `<div class="col-12"><p>You haven't registered for any events yet.</p></div>`;
            return;
        }

        container.innerHTML = myEvents.map(event => `
            <div class="col-md-6">
                <div class="event-card">
                    <h5>${event.title}</h5>
                    <p>📅 ${event.event_date}</p>
                    <p>📍 ${event.venue}</p>
                    <span class="badge bg-success">Registered</span>
                </div>
            </div>
        `).join("");
    } catch (error) {
        console.error(error);
    }
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

loadDashboard();
</script>
</body>
</html>
