<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="dashboard.html">CampusConnect</a>
<a href="dashboard.html" class="btn btn-light">Dashboard</a>
</div>
</nav>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="form-card">
<h2>My Profile</h2><hr>
<div class="mb-3"><label class="fw-bold">Name</label><p id="name">Loading...</p></div>
<div class="mb-3"><label class="fw-bold">Email</label><p id="email">Loading...</p></div>
<div class="mb-3"><label class="fw-bold">Phone</label><p id="phone">Loading...</p></div>
<div class="mb-3"><label class="fw-bold">Course</label><p id="course">Loading...</p></div>
<div class="mb-3"><label class="fw-bold">Account Type</label><p id="role">Loading...</p></div>
</div>
</div>
</div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "login.html";

async function loadProfile() {
    try {
        const response = await fetch("http://localhost:5000/api/profile", {
            headers: {"Authorization": `Bearer ${token}`}
        });
        const data = await response.json();

        document.getElementById("name").textContent = data.name;
        document.getElementById("email").textContent = data.email;
        document.getElementById("phone").textContent = data.phone || "Not provided";
        document.getElementById("course").textContent = data.course || "Not provided";
        document.getElementById("role").textContent = data.role;
    } catch (error) {
        alert("Unable to load profile");
    }
}

loadProfile();
</script>
</body>
</html>
