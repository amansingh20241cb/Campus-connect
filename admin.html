<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<span class="navbar-brand fw-bold">CampusConnect Admin</span>
<button class="btn btn-light" onclick="logout()">Logout</button>
</div>
</nav>

<div class="container py-5">
<h1>Admin Dashboard</h1>
<p class="text-muted">Manage CampusConnect from here.</p>

<div class="row g-4 mt-3">
<div class="col-md-4"><div class="stat-card"><h5>Total Students</h5><h2 id="students">0</h2></div></div>
<div class="col-md-4"><div class="stat-card"><h5>Total Events</h5><h2 id="events">0</h2></div></div>
<div class="col-md-4"><div class="stat-card"><h5>Registrations</h5><h2 id="registrations">0</h2></div></div>
</div>

<div class="dashboard-card mt-5">
<h3>Create Event</h3>
<form id="eventForm" class="row g-3 mt-2">
<div class="col-md-6"><input id="title" class="form-control" placeholder="Event Title" required></div>
<div class="col-md-6">
<select id="category" class="form-select" required>
<option value="">Select Category</option>
<option>Technology</option><option>Cultural</option><option>Sports</option>
<option>Workshop</option><option>Seminar</option>
</select>
</div>
<div class="col-md-12"><textarea id="description" class="form-control" placeholder="Description" required></textarea></div>
<div class="col-md-4"><input id="event_date" type="date" class="form-control" required></div>
<div class="col-md-4"><input id="event_time" type="time" class="form-control" required></div>
<div class="col-md-4"><input id="venue" class="form-control" placeholder="Venue" required></div>
<div class="col-md-4"><input id="capacity" type="number" class="form-control" placeholder="Capacity" value="100"></div>
<div class="col-md-4"><input id="organizer" class="form-control" placeholder="Organizer"></div>
<div class="col-md-4"><button class="btn btn-primary w-100">Create Event</button></div>
</form>
</div>

<div class="dashboard-card mt-5">
<h3>All Registrations</h3>
<div class="table-responsive">
<table class="table mt-3">
<thead><tr><th>Student</th><th>Email</th><th>Event</th><th>Date</th><th>Registered</th></tr></thead>
<tbody id="registrationTable"></tbody>
</table>
</div>
</div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
