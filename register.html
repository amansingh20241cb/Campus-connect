<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CampusConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container"><a class="navbar-brand fw-bold" href="index.html">CampusConnect</a></div>
</nav>

<div class="login-container">
<div class="form-card">
<h2 class="text-center mb-4">Create Account</h2>
<form id="registerForm">
<div class="mb-3"><label class="form-label">Full Name</label><input type="text" id="name" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Phone</label><input type="text" id="phone" class="form-control"></div>
<div class="mb-3"><label class="form-label">Course</label><input type="text" id="course" class="form-control"></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" id="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Create Account</button>
</form>
<div id="message" class="mt-3"></div>
<p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        course: document.getElementById("course").value,
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("http://localhost:5000/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });
        const result = await response.json();
        const message = document.getElementById("message");

        if (response.ok) {
            message.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
            document.getElementById("registerForm").reset();
            setTimeout(() => window.location.href = "login.html", 1500);
        } else {
            message.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
        }
    } catch (error) {
        document.getElementById("message").innerHTML =
            `<div class="alert alert-danger">Backend server is not running.</div>`;
    }
});
</script>
</body>
</html>
