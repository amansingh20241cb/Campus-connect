<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CampusConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container"><a class="navbar-brand fw-bold" href="index.html">CampusConnect</a></div>
</nav>

<div class="login-container">
<div class="form-card">
<h2 class="text-center mb-4">Login</h2>
<form id="loginForm">
<div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" id="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Login</button>
</form>
<div id="message" class="mt-3"></div>
<p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
</div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });

        const result = await response.json();

        if (!response.ok) {
            document.getElementById("message").innerHTML =
                `<div class="alert alert-danger">${result.message}</div>`;
            return;
        }

        localStorage.setItem("token", result.token);
        localStorage.setItem("user", JSON.stringify(result.user));

        window.location.href = result.user.role === "admin"
            ? "admin.html"
            : "dashboard.html";
    } catch (error) {
        document.getElementById("message").innerHTML =
            `<div class="alert alert-danger">Backend server is not running.</div>`;
    }
});
</script>
</body>
</html>
